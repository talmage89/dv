# dv key bindings.
#
# Each line binds an action to one or more keys, separated by spaces. To change
# a binding, copy its line into overrides.conf in this directory (gitignored)
# and rebuild with `make install`. An override replaces every key of that
# action; an action listed with no keys is unbound.
#
# Key names: letters (N is Shift+n), enter, esc, tab, shift+tab, space,
# backspace, delete, up, down, left, right, pgup, pgdown, home, end, ctrl+<key>.
# ctrl+c always quits or stops and cannot be rebound.
#
# On the home screen typing goes into the search box, so bind home commands to
# uppercase letters or ctrl+ keys.

# Home screen
home.open           enter
home.escape         esc
home.up             up ctrl+p ctrl+k shift+tab
home.down           down ctrl+n ctrl+j tab
home.page-up        pgup
home.page-down      pgdown
home.help           ?
home.new            N
home.fresh          W
home.park           Z
home.detach         D
home.delete         X
home.copy           Y
home.prune          P
home.sweep          S
home.run            R
home.scale          O
home.main           M
home.config         C
home.log            L
home.fetch          F

# Lists: prune, sweep, config, log, run output
list.up             up k ctrl+p
list.down           down j ctrl+n
list.page-up        pgup
list.page-down      pgdown
list.toggle         space
list.toggle-all     a
list.confirm        enter
list.back           esc q
list.help           ?

# Text fields: new branch, run command, config values
text.submit         enter
text.cancel         esc

# New branch
newbranch.switch    tab shift+tab up down

# Config
config.edit         enter e
config.prev         left h
config.next         right l
config.reset        u backspace delete

# Log
log.sync            s
log.force-sync      f
log.clear           c

# Scale
scale.down          left h - down j
scale.up            right l + = up k
scale.erase         backspace
scale.apply         enter

# Run
run.where           tab shift+tab
run.history-prev    up
run.history-next    down
run.page-up         pgup ctrl+u b
run.page-down       pgdown ctrl+d space
run.top             g home
run.bottom          G end
run.zoom            enter z
run.failed-only     f
run.rerun-failed    r
run.rerun-all       R
run.stop            x
run.edit            e

# Confirmation dialogs
modal.yes           y Y enter
modal.no            n N esc q
