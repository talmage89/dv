version: "2"

linters:
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - misspell
    - nilerr
    - revive
    - unconvert
    - unparam
  settings:
    revive:
      rules:
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
  exclusions:
    presets:
      - comments
      - std-error-handling
    rules:
      # Test fixtures ignore errors from setup calls such as os.Remove.
      - path: _test\.go
        linters: [errcheck]

formatters:
  enable:
    - gofmt
